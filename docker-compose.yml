# Local development infrastructure (Standards §3 "local", Tech §13.2).
# Every credential comes from .env; copy .env.example to .env first.
# REGISTRY_MIRROR lets images come from a mirror reachable from Iran (Tech §13.4).
name: payknameh

services:
  postgres:
    image: ${REGISTRY_MIRROR:-docker.io}/library/postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?set in .env}
      DB_NAME: ${DB_NAME:?set in .env}
      DB_TEST_NAME: ${DB_TEST_NAME:?set in .env}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?set in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set in .env}
      DB_APP_USER: ${DB_APP_USER:?set in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Official MinIO images are no longer published; pgsty/minio is a community build of
    # the same server (decision 2026-10-04, PK-004).
    image: ${REGISTRY_MIRROR:-docker.io}/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set in .env}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot job: creates the default bucket once MinIO is healthy, then exits.
  minio-init:
    image: ${REGISTRY_MIRROR:-docker.io}/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
      S3_BUCKET: ${S3_BUCKET:?set in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

volumes:
  postgres-data:
  minio-data:
